<!-- index.html -->
{% extends 'AuthApp/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}

Welcome {{ user.username }}

<div class="container mt-5">
    <h1>Attendance</h1>
    <form method="post" action="{% url 'takeAttendence' %}" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Date and Time Selection -->
        <div class="form-group">
            <label for="date_time">Select Date and Time:</label>
            <input type="datetime-local" id="date_time" name="date_time" class="form-control" required>
        </div>
        
        <!-- Hall Selection -->
        <div class="form-group">
            <label for="hall">Hall</label>
            <select id="hall" name="hall" class="form-control">
                {% for hall in halls %}
                    <option value="{{ hall.id }}">{{ hall.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Lecture Selection -->
        <div class="form-group">
            <label for="subject">Lecture Name</label>
            <select id="subject" name="subject" class="form-control">
                {% for subject in subjects %}
                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- File Input for Multiple Images -->
        <div class="form-group">
            <label for="images">Upload Images</label>
            <input type="file" id="images" name="images" class="form-control" accept="image/*" multiple required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary mt-2">Take Attendance</button>
    </form>
</div>

<script>
    // Function to set the current date and time as the default value
    function setCurrentDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0'); // Month is 0-indexed
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const datetimeLocal = `${year}-${month}-${day}T${hours}:${minutes}`;
        document.getElementById('date_time').value = datetimeLocal;
    }

    // Call the function to set current date and time on page load
    document.addEventListener("DOMContentLoaded", setCurrentDateTime);
</script>

{% endblock %}
